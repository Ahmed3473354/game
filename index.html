<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        اصطياد الهدف
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="game-container">

        <h1>
            🎯 اصطياد الهدف
        </h1>

        <p class="description">
            اضغط على الهدف بأسرع ما يمكنك!
        </p>

        <div class="game-info">

            <div class="info-box">
                <span>النقاط</span>
                <strong id="score">
                    0
                </strong>
            </div>

            <div class="info-box">
                <span>الوقت</span>
                <strong id="time">
                    30
                </strong>
            </div>

            <div class="info-box">
                <span>الأفضل</span>
                <strong id="best">
                    0
                </strong>
            </div>

        </div>

        <div
            id="gameArea"
            class="game-area"
        >

            <button
                id="target"
                class="target"
                type="button"
                aria-label="الهدف"
            >
                🎯
            </button>

            <div
                id="gameMessage"
                class="game-message"
            >
                اضغط ابدأ للعب
            </div>

        </div>

        <button
            id="startButton"
            class="start-button"
            type="button"
        >
            ▶ ابدأ اللعبة
        </button>

    </main>

    <script src="game.js"></script>

</body>

</html>
